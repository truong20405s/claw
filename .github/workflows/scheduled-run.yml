name: Scheduled MiMo Auto Login

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scheduled:
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.1-noble
      options: --shm-size=2g

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Find Chrome binary
        run: |
          CHROME_PATH=$(find /ms-playwright -name 'chrome' -type f 2>/dev/null | head -1)
          if [ -z "$CHROME_PATH" ]; then
            CHROME_PATH=$(which chromium || which chromium-browser || which google-chrome || which chrome || echo '')
          fi
          if [ -z "$CHROME_PATH" ]; then
            echo 'ERROR: Chrome not found!'
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          echo "Found Chrome: $CHROME_PATH"

      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/state.json
          key: mimo-scheduled-state
          restore-keys: |
            mimo-scheduled-state

      - name: Show current state
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f state.json ]; then
            echo "=== Current State ==="
            cat state.json
          else
            echo "=== No state file (first run) ==="
          fi

      - name: Run scheduled task
        run: |
          cd $GITHUB_WORKSPACE
          python run_scheduled.py --headless

      - name: Show updated state
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f state.json ]; then
            echo "=== Updated State ==="
            cat state.json
          fi

      - name: Commit state
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git -C $GITHUB_WORKSPACE remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git -C $GITHUB_WORKSPACE add state.json || true
          git -C $GITHUB_WORKSPACE diff --cached --quiet || git -C $GITHUB_WORKSPACE commit -m "chore: update state [skip ci]" && git -C $GITHUB_WORKSPACE push || echo "Nothing to commit"
