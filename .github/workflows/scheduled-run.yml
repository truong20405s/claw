name: Scheduled MiMo Auto Login

on:
  # Chạy mỗi giờ — script tự kiểm tra đủ 4h chưa
  schedule:
    - cron: '0 * * * *'

  # Cho phép chạy manual từ GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scheduled:
    # Dùng container có sẵn Chromium — không cần cài lại mỗi lần
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.1-noble
      options: --shm-size=2g

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Restore state từ lần chạy trước
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: mimo-scheduled-state
          restore-keys: |
            mimo-scheduled-state

      - name: Show current state
        run: |
          if [ -f state.json ]; then
            echo "=== Current State ==="
            cat state.json
          else
            echo "=== No state file (first run) ==="
          fi

      - name: Run scheduled task
        run: |
          # Playwright container đã có Chromium + display server
          python run_scheduled.py --headless

      - name: Show updated state
        if: always()
        run: |
          if [ -f state.json ]; then
            echo "=== Updated State ==="
            cat state.json
          fi

      # Commit state file về repo
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state.json
          git diff --cached --quiet || git commit -m "chore: update state [skip ci]" && git push
