name: Test Login Only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-login:
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.1-noble
      options: --shm-size=2g

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Find Chrome binary
        run: |
          CHROME_PATH=$(find /ms-playwright -name 'chrome' -type f 2>/dev/null | head -1)
          if [ -z "$CHROME_PATH" ]; then
            CHROME_PATH=$(which chromium || which chromium-browser || which google-chrome || which chrome || echo '')
          fi
          if [ -z "$CHROME_PATH" ]; then
            echo 'ERROR: Chrome not found!'
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          echo "Found Chrome: $CHROME_PATH"

      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run single account login test
        run: |
          cd $GITHUB_WORKSPACE
          python test_single_login.py

      - name: Show final state
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f state.json ]; then
            echo "=== Final State ==="
            cat state.json
          fi

      - name: Commit state
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update test state [skip ci]" && git push
