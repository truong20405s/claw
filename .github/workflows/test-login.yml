name: Test Login Only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-login:
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.1-noble
      options: --shm-size=2g

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Find Chrome binary
        run: |
          CHROME_PATH=$(find /ms-playwright -name 'chrome' -type f 2>/dev/null | head -1)
          if [ -z "$CHROME_PATH" ]; then
            CHROME_PATH=$(which chromium || which chromium-browser || which google-chrome || which chrome || echo '')
          fi
          if [ -z "$CHROME_PATH" ]; then
            echo 'ERROR: Chrome not found!'
            find /ms-playwright -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          echo "Found Chrome: $CHROME_PATH"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run login test (single account)
        working-directory: ${{ github.workspace }}
        run: python -c "
import asyncio, nodriver as uc
from account_rotation import run_account_session
from app_config import parse_args
import argparse, sys, logging
logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(name)s: %(message)s', handlers=[logging.StreamHandler(sys.stdout)])
args = parse_args()
args.headless = True
args.login_only = True
args.url = 'https://aistudio.xiaomimimo.com/'
args.timeout = 60
args.prompt_source = ''
args.screenshot = ''
args.otp_timeout = 120
args.proxy_server = None
async def test():
    completed = await run_account_session(args, 'mi12@tempmail.id.vn', 'nvt2005S!')
    print(f'\nResult: {"✅ SUCCESS" if completed else "❌ FAILED"}')
uc.loop().run_until_complete(test())
"

      - name: Show final state
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f state.json ]; then
            echo "=== Final State ==="
            cat state.json
          fi

      - name: Commit state
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update test state [skip ci]" && git push
