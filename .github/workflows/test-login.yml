name: Test Login Only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-login:
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.1-noble
      options: --shm-size=2g

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run login test (all accounts, 1min interval)
        run: python run_scheduled.py --headless --login-only

      - name: Show final state
        if: always()
        run: |
          if [ -f state.json ]; then
            echo "=== Final State ==="
            cat state.json
          fi

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update test state [skip ci]" && git push
